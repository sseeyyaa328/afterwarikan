<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>サークルご飯代計算機</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #f5f7fa;
  color: #222;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans JP",
    sans-serif;
}

.container {
  max-width: 600px;
  margin: 0 auto;
  padding: 20px;
}

h1 {
  font-size: 25px;
  margin: 5px 0;
}

.subtitle {
  color: #666;
  font-size: 13px;
  margin-bottom: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 15px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.07);
}

h2 {
  font-size: 18px;
  margin: 0 0 15px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

label {
  display: block;
  font-size: 13px;
  color: #555;
  margin-bottom: 5px;
}

input {
  width: 100%;
  padding: 11px;
  border: 1px solid #d5d9df;
  border-radius: 10px;
  font-size: 16px;
  background: white;
}

button {
  width: 100%;
  border: none;
  border-radius: 11px;
  padding: 13px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  background: #222;
  color: white;
  margin-top: 12px;
}

button.secondary {
  background: #e9edf2;
  color: #222;
}

.coefficient-note {
  font-size: 12px;
  color: #666;
  line-height: 1.6;
  margin-top: 10px;
}

.result-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
}

.result-row:last-child {
  border-bottom: none;
}

.year {
  font-weight: bold;
}

.people {
  color: #777;
  font-size: 13px;
  margin-top: 3px;
}

.price {
  font-size: 20px;
  font-weight: 800;
}

.free {
  color: #777;
  font-size: 15px;
}

.total {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-top: 2px solid #222;
  margin-top: 10px;
  padding-top: 15px;
  font-size: 18px;
  font-weight: bold;
}

.warning {
  background: #fff4df;
  border-radius: 10px;
  padding: 10px;
  margin-top: 12px;
  font-size: 13px;
  display: none;
}

.note {
  font-size: 12px;
  color: #666;
  line-height: 1.7;
  margin-top: 12px;
}

@media (max-width: 430px) {
  .container {
    padding: 15px;
  }

  h1 {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="container">

  <h1>🍚 サークルご飯代計算機</h1>

  <div class="subtitle">
    学年ごとの負担係数から、ご飯代を自動計算します。
  </div>


  <!-- 人数 -->
  <div class="card">

    <h2>① 参加人数</h2>

    <div class="grid">

      <div>
        <label>1回生</label>
        <input
          id="n1"
          type="number"
          min="0"
          value="0"
        >
      </div>

      <div>
        <label>2回生</label>
        <input
          id="n2"
          type="number"
          min="0"
          value="0"
        >
      </div>

      <div>
        <label>3回生</label>
        <input
          id="n3"
          type="number"
          min="0"
          value="0"
        >
      </div>

      <div>
        <label>4回生以上</label>
        <input
          id="n4"
          type="number"
          min="0"
          value="0"
        >
      </div>

    </div>

  </div>


  <!-- 負担係数 -->
  <div class="card">

    <h2>② 負担係数</h2>

    <div class="grid">

      <div>
        <label>1回生</label>
        <input
          id="c1"
          type="number"
          min="0"
          step="0.01"
          value="0"
        >
      </div>

      <div>
        <label>2回生</label>
        <input
          id="c2"
          type="number"
          min="0"
          step="0.01"
          value="1"
        >
      </div>

      <div>
        <label>3回生</label>
        <input
          id="c3"
          type="number"
          min="0"
          step="0.01"
          value="1.25"
        >
      </div>

      <div>
        <label>4回生以上</label>
        <input
          id="c4"
          type="number"
          min="0"
          step="0.01"
          value="1.5"
        >
      </div>

    </div>

    <div class="coefficient-note">
      初期設定：<br>
      1回生＝無料 ／ 2回生＝1 ／ 3回生＝1.25 ／ 4回生以上＝1.5
    </div>

  </div>


  <!-- 合計金額 -->
  <div class="card">

    <h2>③ ご飯代</h2>

    <label>
      お店に支払う合計金額（円）
    </label>

    <input
      id="total"
      type="number"
      min="0"
      step="100"
      placeholder="例：30000"
    >

    <button onclick="calculate()">
      計算する
    </button>

    <button
      class="secondary"
      onclick="resetForm()"
    >
      初期値に戻す
    </button>

  </div>


  <!-- 結果 -->
  <div
    class="card"
    id="resultCard"
    style="display:none;"
  >

    <h2>計算結果</h2>

    <div id="results"></div>

    <div class="total">
      <span>集金予定額</span>
      <span id="collection">0円</span>
    </div>

    <div
      id="warning"
      class="warning"
    ></div>

    <div class="note">
      ※ 料金は100円単位を基本に調整しています。<br>
      ※ 1回生の負担係数を0にすると無料になります。
    </div>

  </div>

</div>


<script>

/* 数値を取得する関数 */
function getValue(id) {

  const value =
    Number(document.getElementById(id).value);

  return Math.max(0, value || 0);
}


/* 計算 */
function calculate() {

  const people = [

    {
      year: "1回生",
      n: Math.floor(getValue("n1")),
      coefficient: getValue("c1")
    },

    {
      year: "2回生",
      n: Math.floor(getValue("n2")),
      coefficient: getValue("c2")
    },

    {
      year: "3回生",
      n: Math.floor(getValue("n3")),
      coefficient: getValue("c3")
    },

    {
      year: "4回生以上",
      n: Math.floor(getValue("n4")),
      coefficient: getValue("c4")
    }

  ];


  const total =
    Math.round(getValue("total"));


  if (total <= 0) {

    alert("合計金額を入力してください。");

    return;
  }


  /*
    支払う人全体の負担係数を計算
  */

  let totalWeight = 0;

  people.forEach(person => {

    if (
      person.n > 0 &&
      person.coefficient > 0
    ) {

      totalWeight +=
        person.n * person.coefficient;

    }

  });


  if (totalWeight <= 0) {

    alert(
      "参加人数と負担係数を確認してください。"
    );

    return;
  }


  /*
    まず理論上の1人あたり金額を計算
  */

  people.forEach(person => {

    if (
      person.n > 0 &&
      person.coefficient > 0
    ) {

      person.rawPrice =
        total *
        person.coefficient /
        totalWeight;

    } else {

      person.rawPrice = 0;

    }

  });


  /*
    100円単位に切り下げ
  */

  people.forEach(person => {

    if (person.coefficient > 0) {

      person.price =
        Math.floor(
          person.rawPrice / 100
        ) * 100;

    } else {

      person.price = 0;

    }

  });


  /*
    100円単位で不足分を調整
  */

  let collected = 0;

  people.forEach(person => {

    collected +=
      person.price * person.n;

  });


  let difference =
    total - collected;


  /*
    端数が大きい学年から100円ずつ追加
  */

  const candidates =
    people
      .filter(person =>
        person.n > 0 &&
        person.coefficient > 0
      )
      .sort((a, b) => {

        const remainderA =
          a.rawPrice % 100;

        const remainderB =
          b.rawPrice % 100;

        return remainderB - remainderA;

      });


  let safety = 0;


  while (
    difference >= 100 &&
    candidates.length > 0 &&
    safety < 10000
  ) {

    for (const person of candidates) {

      if (difference < 100) {
        break;
      }

      person.price += 100;

      difference -=
        person.n * 100;

    }

    safety++;

  }


  /*
    最終的な集金額
  */

  collected = 0;

  people.forEach(person => {

    collected +=
      person.price * person.n;

  });


  /*
    結果を表示
  */

  const results =
    document.getElementById("results");

  results.innerHTML = "";


  people.forEach(person => {

    const row =
      document.createElement("div");

    row.className =
      "result-row";


    const left =
      document.createElement("div");

    left.innerHTML = `
      <div class="year">
        ${person.year}
      </div>

      <div class="people">
        ${person.n}人
      </div>
    `;


    const right =
      document.createElement("div");

    right.className =
      "price";


    if (
      person.coefficient === 0 ||
      person.n === 0
    ) {

      right.innerHTML =
        '<span class="free">無料</span>';

    } else {

      right.textContent =
        person.price.toLocaleString()
        + "円";

    }


    row.appendChild(left);

    row.appendChild(right);

    results.appendChild(row);

  });


  /*
    集金予定額
  */

  document.getElementById(
    "collection"
  ).textContent =
    collected.toLocaleString()
    + "円";


  /*
    差額表示
  */

  const warning =
    document.getElementById("warning");


  if (collected !== total) {

    warning.style.display =
      "block";

    warning.textContent =
      "お店の合計金額と集金額に "
      +
      Math.abs(total - collected)
        .toLocaleString()
      +
      "円の差があります。";

  } else {

    warning.style.display =
      "none";

  }


  /*
    結果カードを表示
  */

  document.getElementById(
    "resultCard"
  ).style.display =
    "block";

}


/* リセット */
function resetForm() {

  document.getElementById("n1").value = 0;
  document.getElementById("n2").value = 0;
  document.getElementById("n3").value = 0;
  document.getElementById("n4").value = 0;

  document.getElementById("c1").value = 0;
  document.getElementById("c2").value = 1;
  document.getElementById("c3").value = 1.25;
  document.getElementById("c4").value = 1.5;

  document.getElementById("total").value = "";

  document.getElementById(
    "resultCard"
  ).style.display = "none";

}

</script>

</body>
</html>
